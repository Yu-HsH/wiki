<svg class="parry-art" viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg">
<style>
/* Animation from the approved V4 preview. */
.parry-art {overflow:visible}
.parry-back,.parry-shield,.parry-attack,.parry-impact,.parry-sparks,.parry-counter,.parry-shock,.parry-letters,.parry-glints,.parry-ring-a,.parry-ring-b,.parry-mark{opacity:0;transform-box:fill-box;transform-origin:center}
.parry-attack{transform-origin:center}
.parry-counter{transform-origin:10% 50%}
.parry-shock{transform-origin:center}
.parry-letters{transform-origin:center}
.parry-back{animation:paBack 3.25s both}
@keyframes paBack{0%,9%{opacity:0;transform:scale(.7)}21%{opacity:.5;transform:scale(.9)}31%,62%{opacity:.92;transform:scale(1.02)}88%,100%{opacity:0;transform:scale(1.25)}}
.parry-ring-a{animation:paRingA 3.25s both}
@keyframes paRingA{0%,12%{opacity:0;transform:rotate(-90deg) scale(.4)}23%{opacity:1;transform:rotate(-20deg) scale(.95)}34%{opacity:1;transform:rotate(32deg) scale(1.16)}60%{opacity:.8;transform:rotate(133deg) scale(1.2)}91%,100%{opacity:0;transform:rotate(195deg) scale(1.33)}}
.parry-ring-b{animation:paRingB 3.25s both}
@keyframes paRingB{0%,17%{opacity:0;transform:rotate(70deg) scale(.45)}27%{opacity:.95;transform:rotate(-12deg) scale(1.04)}44%{opacity:1;transform:rotate(-54deg) scale(1.09)}68%{opacity:.5;transform:rotate(-147deg) scale(1.23)}100%{opacity:0;transform:rotate(-200deg) scale(1.27)}}
.parry-shield{animation:paShield 3.25s both}
@keyframes paShield{0%,13%{opacity:0;transform:scale(.18) rotate(-45deg)}21%{opacity:1;transform:scale(1.19) rotate(10deg)}26%{opacity:1;transform:scale(.98) rotate(-3deg)}29%,32%{opacity:1;transform:scale(.98) rotate(-3deg)}36%{opacity:1;transform:translateX(-13px) scale(1.08) rotate(-8deg)}43%{opacity:1;transform:translateX(5px) scale(1.04) rotate(3deg)}74%{opacity:1;transform:scale(1.01)}100%{opacity:0;transform:scale(.82) rotate(14deg)}}
.parry-attack{animation:paAttack 3.25s both}
@keyframes paAttack{0%,6%{opacity:0;transform:translateX(150px) scaleX(1.17)}12%{opacity:1;transform:translateX(140px) scaleX(1.13)}25%{opacity:1;transform:translateX(-6px) scaleX(1.02)}29%,32%{opacity:1;transform:translateX(-12px) scaleX(.92)}34%{opacity:.38;transform:translateX(6px) scaleX(.68)}40%,100%{opacity:0;transform:translateX(50px) scaleX(.1)}}
.parry-impact{animation:paImpact 3.25s both}
@keyframes paImpact{0%,27%{opacity:0;transform:scale(.09) rotate(0)}29%,32%{opacity:1;transform:scale(1.06) rotate(9deg)}38%{opacity:.85;transform:scale(1.38) rotate(19deg)}48%,100%{opacity:0;transform:scale(1.8) rotate(27deg)}}
.parry-shock{animation:paShock 3.25s both}
@keyframes paShock{0%,28%{opacity:0;transform:scale(.16)}32%{opacity:1;transform:scale(.44)}42%{opacity:.65;transform:scale(1.55)}61%,100%{opacity:0;transform:scale(2.5)}}
.parry-sparks{animation:paSparks 3.25s both}
@keyframes paSparks{0%,28%{opacity:0;transform:scale(.2) rotate(-22deg)}31%,35%{opacity:1;transform:scale(1.12) rotate(9deg)}47%{opacity:.7;transform:scale(1.6) rotate(28deg)}67%,100%{opacity:0;transform:scale(2.25) rotate(54deg)}}
.parry-counter{animation:paCounter 3.25s both}
@keyframes paCounter{0%,36%{opacity:0;transform:translateX(-24px) scaleX(.13) scaleY(.7)}43%{opacity:1;transform:translateX(7px) scaleX(.75) scaleY(1.2)}51%{opacity:1;transform:translateX(125px) scaleX(1.28) scaleY(.94)}61%{opacity:.7;transform:translateX(265px) scaleX(1.48) scaleY(.7)}72%,100%{opacity:0;transform:translateX(380px) scaleX(1.7) scaleY(.6)}}
.parry-glints{animation:paGlints 3.25s both}
@keyframes paGlints{0%,31%{opacity:0;transform:scale(.7)}39%{opacity:1;transform:scale(1)}53%{opacity:.65;transform:scale(1.35)}73%,100%{opacity:0;transform:scale(1.6)}}
.parry-letters{animation:paLetters 3.25s both}
@keyframes paLetters{0%,32%{opacity:0;transform:translateY(25px) scale(.48) rotate(-7deg)}42%{opacity:1;transform:translateY(-7px) scale(1.14) rotate(3deg)}48%,68%{opacity:1;transform:translateY(0) scale(1)}83%,100%{opacity:0;transform:translateY(-13px) scale(1.06)}}
.parry-mark{animation:paMark 3.25s both}
@keyframes paMark{0%,26%{opacity:0;transform:scale(.25) rotate(-30deg)}31%,38%{opacity:1;transform:scale(1.18) rotate(4deg)}46%{opacity:.7;transform:scale(1.2) rotate(14deg)}58%,100%{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion: reduce) {
  svg * { animation:none !important; }
  .parry-back, .parry-shield, .parry-ring-a, .parry-ring-b, .parry-letters { opacity:1; transform:none; }
}
</style>
