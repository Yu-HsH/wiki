  <linearGradient id="paHeat" x1="1" x2="0"><stop stop-color="#c62642" stop-opacity="0"/><stop offset=".38" stop-color="#ff5b5d"/><stop offset=".78" stop-color="#ffca6a"/><stop offset="1" stop-color="#fff5bd"/></linearGradient>
