name: Jungle Alive isolated browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - "components/wiki-race/JungleAtmosphere.jsx"
      - "css/wikiRaceAmbient.css"
      - "utils/jungleParallax.js"
      - "scripts/jungle-alive-browser-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atmosphere:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fixture browser smoke (no production APIs)
        run: node scripts/jungle-alive-browser-smoke.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jungle-alive-browser
          path: .temp/jungle-alive-browser/
          if-no-files-found: ignore
          retention-days: 7
