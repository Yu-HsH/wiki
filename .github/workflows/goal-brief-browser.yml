name: Goal brief isolated browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - "pages/GamePage.jsx"
      - "services/dailyChallengeService.js"
      - "data/dailyGoalDescriptions.js"
      - "components/WikiViewer.jsx"
      - "css/app.css"
      - "scripts/quality-goal-browser-smoke.mjs"
      - "tests/browser-fixtures/**"
      - ".github/workflows/goal-brief-browser.yml"

permissions:
  contents: read

jobs:
  goal-brief-browser:
    name: Chromium mobile goal brief
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated viewer browser QA
        run: node scripts/quality-goal-browser-smoke.mjs
