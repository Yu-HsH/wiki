name: Home width temporary QA
on:
  push:
    branches: [fix/jungle65-home-width-20261104]
permissions:
  contents: read
jobs:
  frontend-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/jungle-alive-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-width-browser
          path: .temp/jungle-alive-browser/after/
          if-no-files-found: ignore
          retention-days: 7
