name: Site news admin RLS and UI QA
on:
  pull_request:
    paths:
      - ".github/workflows/site-news-admin-ci.yml"
      - "supabase/migrations/*_site_news_admin_v1.sql"
      - "services/siteNewsService.js"
      - "pages/UpdatesPage.jsx"
      - "pages/AdminUpdatesPage.jsx"
      - "components/wiki-race/WikiRaceShell.jsx"
      - "data/updateNotices.js"
      - "css/wikiRaceUpdates.css"
      - "scripts/sql/site-news-admin-*.sql"
      - "tests/siteNewsAdmin.test.js"
      - "App.jsx"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres-news-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: ci_only
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Validate site news app code
        run: |
          node --test tests/siteNewsAdmin.test.js
          npm run build
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Verify admin RLS and no untrusted role escalation
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/sql/site-news-admin-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110023343_site_news_admin_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/sql/site-news-admin-security-assert.sql
