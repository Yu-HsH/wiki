name: S5 dependency patch candidate (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s5-dependency-patch-candidate.yml'

permissions:
  contents: read

jobs:
  runtime-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate patched runtime dependency lockfile (no repository write)
        run: |
          npm install --save-exact react-router-dom@7.18.6 zod@4.6.6 vite@8.3.8 --no-audit --no-fund
          npm install --save-dev --save-exact esbuild@latest --no-audit --no-fund
          npm update --no-audit --no-fund
          npm ls react-router-dom react-router @remix-run/router zod ws
      - name: Reinstall generated lockfile reproducibly
        run: npm ci --no-audit --no-fund
      - name: Verify runtime dependency security inventory
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/runtime-audit.json" || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/runtime-audit.json","utf8"));
          if (!report.vulnerabilities || !report.metadata?.vulnerabilities) throw Error("npm audit did not produce a valid inventory");
          console.log("RUNTIME TOTALS",JSON.stringify(report.metadata.vulnerabilities));
          for (const [name,detail] of Object.entries(report.vulnerabilities)) console.log("VULNERABILITY",name,detail.severity,JSON.stringify(detail.fixAvailable));
          if (report.metadata.vulnerabilities.total!==0) process.exitCode=1;
          NODE
      - name: Adapt test-only server router import to React Router 7
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='tests/rewardsUx.test.js';
          const old='await import("react-router-dom/server.js")';
          const src=fs.readFileSync(file,'utf8');
          if(!src.includes(old)) throw Error("Expected React Router v6 test import missing");
          const upgraded=src.replace(old,'await import("react-router")');
          fs.writeFileSync(file,upgraded);
          NODE
      - name: Verify full dependency vulnerability inventory
        run: |
          npm audit --json > "$RUNNER_TEMP/full-audit.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/full-audit.json','utf8'));
          if(!report.metadata?.vulnerabilities)throw Error('Invalid npm audit report');
          console.log('FULL TOTALS',JSON.stringify(report.metadata.vulnerabilities));
          for(const [name,issue] of Object.entries(report.vulnerabilities||{})) console.log('FULL PACKAGE',name,issue.severity,JSON.stringify(issue.fixAvailable));
          NODE
      - name: Run JavaScript test suite
        run: npm test
      - name: Build default app
        run: npm run build
      - name: Build S5 plus duel v4
        run: VITE_GROUP_ITEMS_S5_ENTRY=1 VITE_DUEL_ITEMS_V4_ENTRY=1 npm run build
      - name: Export verified candidate text for draft branch update
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          for(const file of ['package.json','package-lock.json','tests/rewardsUx.test.js']){
            const data=fs.readFileSync(file,'utf8');
            const sha=createHash('sha256').update(data).digest('hex');
            const chunks=[];
            for(let offset=0;offset<data.length;offset+=1200)chunks.push(data.slice(offset,offset+1200));
            console.log('CANDIDATE_BEGIN|'+file+'|'+chunks.length+'|'+sha);
            chunks.forEach((part,i)=>console.log('CANDIDATE_CHUNK|'+file+'|'+i+'|'+JSON.stringify(part)));
            console.log('CANDIDATE_END|'+file+'|'+chunks.length);
          }
          NODE
      - name: Upload exactly patched package manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-runtime-patch-manifests
          path: |
            package.json
            package-lock.json
            tests/rewardsUx.test.js
          retention-days: 5
