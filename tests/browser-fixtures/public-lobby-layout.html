<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplayer public room responsiveness QA</title></head><body>
<div class="wr-page wr-entry"><div class="wr-shell"><main class="wr-entry wr65-entry">
<h1>1:1 탐험가 모집</h1><p class="wr-entry-rules">공개방 목록과 방 코드 참가 및 방 만들기 화면입니다.</p>
<div class="wr65-entry-layout">
<section class="mp-public-board" aria-label="공개방 목록"><div class="mp-public-board__header"><div><span class="wr-kicker">PUBLIC EXPEDITIONS · 공개 원정대</span><h2>참가할 수 있는 1:1 방</h2><p>공개 설정된 대기방만 표시됩니다. 비공개방은 방 코드로 참가하세요.</p></div><button class="mp-action-btn mp-action-btn--secondary">새로고침</button></div><ul class="mp-public-board__list"><li class="mp-public-room"><span class="mp-public-room__flag">⚑</span><div class="mp-public-room__detail"><strong>TEST 탐험가님의 방</strong><span class="mp-public-room__meta">1/2명 · 아이템전</span></div><button class="mp-action-btn mp-action-btn--primary">참가하기</button></li></ul></section>
<div class="mp-mode-panel"><div class="mp-card mp-card--join"><div class="wr-kicker">02 · 초대받은 탐험가</div><h3 class="mp-card-title">코드로 참가</h3><p class="mp-card-desc">공유받은 6자리 방 코드로 참가하세요.</p><form class="mp-join-row"><input class="mp-code-input" placeholder="예: JUNG65" aria-label="1:1 방 코드"><button class="mp-action-btn mp-action-btn--secondary" type="button">참가</button></form></div>
<div class="mp-card mp-card--create"><div class="wr-kicker">03 · 새 탐험 열기</div><h3 class="mp-card-title">방 만들기</h3><p class="mp-card-desc">방장이 되어 목표 문서를 정하고 상대에게 방 코드를 공유하세요.</p><label class="mp-option"><input type="checkbox">아이템 사용 · 시작 시 5칸</label><label class="mp-option"><input type="checkbox">공개방으로 만들기 · 다른 탐험가가 목록에서 참가할 수 있습니다</label><button class="mp-action-btn mp-action-btn--primary">방 생성</button></div></div>
</div></main></div></div>
<script type="module">import "../../appStyles.js";import "../../css/jungle65Lobby.css";</script>
</body></html>
