<!doctype html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kion Emotes Browser Fixture</title>
</head><body><div id="root"></div>
<script type="module">
import React from "react";
import {createRoot} from "react-dom/client";
import "../../appStyles.js";
import {KionEmotePicker, KionEmoteBubble, KionEmoteSticker} from "../../components/KionEmotes.jsx";
import {KION_EMOTE_PRESETS, getKionEmote, getLegacySpectatorKionAsset} from "../../utils/kionEmoteCatalog.js";

function Fixture() {
  const [sent,setSent] = React.useState("");
  return React.createElement("div",{className:"wr-page wr-race wr65-field",style:{minHeight:"100vh",padding:"12px"}},
    React.createElement("section",{className:"wr-race-shell",style:{padding:12,maxWidth:1024,overflow:"visible"}},
      React.createElement("header",{style:{display:"flex",justifyContent:"space-between",gap:8,alignItems:"center"}},
        React.createElement("h1",{style:{fontSize:19,margin:0}},"키온 10종 · 브라우저 QA"),
        React.createElement("div",{id:"top-picker"},React.createElement(KionEmotePicker,{presets:KION_EMOTE_PRESETS,label:"상단 선택",onSend:setSent}))
      ),
      React.createElement("p",{role:"status",id:"selected"},"선택: "+(sent || "없음")),
      React.createElement("div",{id:"gallery",style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(122px,1fr))",gap:8}},
        KION_EMOTE_PRESETS.map(preset=>React.createElement("article",{key:preset.id,"data-emote":preset.id,
          style:{border:"1px solid #AEBBA5",borderRadius:12,padding:8,background:"#FCFCF7",display:"grid",justifyItems:"center"}},
          React.createElement(KionEmoteSticker,{preset,size:80}),
          React.createElement("strong",null,preset.label)
        ))
      ),
      React.createElement("section",{style:{display:"flex",gap:16,alignItems:"center",marginTop:18}},
        React.createElement("div",{id:"bubble-test"},React.createElement(KionEmoteBubble,{preset:getKionEmote("good")})),
        React.createElement("div",{id:"stale-test"},React.createElement(KionEmoteBubble,{preset:getKionEmote("sad"),stale:true})),
        React.createElement("div",{id:"fallback-test"},React.createElement(KionEmoteSticker,{preset:{id:"missing",label:"대체 이미지",image:"/missing-kion.webp",emoji:"🧪"},size:36}))
      ),
      React.createElement("div",{id:"legacy-test",style:{marginTop:10}},
        ["cheer","wow","hurry","clap","gg"].map(id=>React.createElement("img",{
          key:id,"data-legacy":id,src:getLegacySpectatorKionAsset(id),alt:id,width:38,height:38
        }))
      ),
      React.createElement("footer",{style:{height:280,display:"flex",justifyContent:"flex-end",alignItems:"flex-end",paddingBottom:16}},
        React.createElement("div",{id:"bottom-picker"},React.createElement(KionEmotePicker,{presets:KION_EMOTE_PRESETS,label:"하단 선택",onSend:setSent}))
      )
    )
  );
}
createRoot(document.getElementById("root")).render(React.createElement(Fixture));
</script></body></html>
